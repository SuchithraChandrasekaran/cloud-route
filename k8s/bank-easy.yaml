apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-servicing
  labels:
    app: loan-servicing
  annotations:
    cloud-route/depends-on: "account-ledger,credit-scoring"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-servicing
  template:
    metadata:
      labels:
        app: loan-servicing
    spec:
      containers:
      - name: loan-servicing
        image: bank-easy/loan-servicing:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 4006
        env:
        - name: LEDGER_URL
          value: "http://account-ledger:4002"
        - name: SCORING_URL
          value: "http://credit-scoring:4004"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loan-servicing
spec:
  selector:
    app: loan-servicing
  ports:
  - port: 4006
    targetPort: 4006
