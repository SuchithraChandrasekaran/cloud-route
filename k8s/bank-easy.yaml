apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: bank-easy/auth:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 4001
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
  - port: 4001
    targetPort: 4001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-ledger
  labels:
    app: account-ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-ledger
  template:
    metadata:
      labels:
        app: account-ledger
    spec:
      containers:
      - name: account-ledger
        image: bank-easy/account-ledger:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 4002
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: account-ledger
spec:
  selector:
    app: account-ledger
  ports:
  - port: 4002
    targetPort: 4002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processing
  labels:
    app: payment-processing
  annotations:
    cloud-route/depends-on: "account-ledger"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-processing
  template:
    metadata:
      labels:
        app: payment-processing
    spec:
      containers:
      - name: payment-processing
        image: bank-easy/payment-processing:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 4003
        env:
        - name: LEDGER_URL
          value: "http://account-ledger:4002"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-processing
spec:
  selector:
    app: payment-processing
  ports:
  - port: 4003
    targetPort: 4003
---
